# HarmonyLens local infrastructure.
#   docker compose up -d db        # start PostgreSQL (schema + admin seeded on first run)
#   docker compose down -v         # wipe the volume to re-run the init scripts
services:
  db:
    image: postgres:17-alpine
    container_name: harmonylens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by init/02-seed-admin.sh (first run only).
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      # Bound to loopback only. 5433 because 5432 is commonly taken locally.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - harmonylens-db-data:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./packages/db/init/02-seed-admin.sh:/docker-entrypoint-initdb.d/02-seed-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  harmonylens-db-data:
